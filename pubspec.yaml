name: paw_stay
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.1
  intl: ^0.19.0
  flutter_dotenv: ^5.2.1
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  google_generative_ai: ^0.4.5
  shimmer: ^3.0.0
  animations: ^2.1.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  shared_preferences: ^2.5.4
  razorpay_flutter: ^1.4.1
  share_plus: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icon/
